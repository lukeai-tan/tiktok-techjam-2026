name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.5.2 pytest==9.1.1
      - name: Validate JSON manifests
        run: |
          python -m json.tool benchmarks/official_shapes.json >/dev/null
          python -m json.tool benchmarks/reference/manifest.json >/dev/null
          python -m json.tool docs/workflows/transformer-gpu-kernel.json >/dev/null
      - name: Compile Python sources
        run: python -m compileall -q torch_transformer_benchmark.py transformer_opt benchmarks tools sweep.py
      - name: Run portable contract suite
        run: python -m pytest tests -q
